# cloudflared: connects this host to a remotely managed Cloudflare Tunnel.
# - Only outbound connections to Cloudflare; the host opens no inbound ports.
# - Networks: `default` (this project's own network) for the outbound
#   connection, and the internal `tunnel` network, where its only peer is
#   Traefik. It cannot reach the services behind Traefik directly.
# - Point every public hostname in the Cloudflare dashboard at
#   http://traefik:8081. Traefik allowlists the hosts.
# - The tunnel token is read from a secret file, never from the environment.
name: stack-cloudflared

x-ember-stack:
  generated-secrets: []

services:
  cloudflared:
    image: docker.io/cloudflare/cloudflared:2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    # The image runs as UID 65532.
    command:
      - tunnel
      - --no-autoupdate
      - --metrics=127.0.0.1:20241
      # Do not expose profiling and metrics through Cloudflare's remote management.
      - --management-diagnostics=false
      - run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    networks:
      - default
      - tunnel
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics=127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  default: {}
  tunnel:
    external: true

secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token
