---
- name: Require supported Debian-family host
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
    fail_msg: "The initial Ansible roles support Debian/Ubuntu hosts only."

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: Etc/UTC
