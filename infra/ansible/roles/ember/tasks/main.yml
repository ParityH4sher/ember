---
- name: Create Ember deployment directory
  ansible.builtin.file:
    path: "{{ ember_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create deployment configuration directory
  ansible.builtin.file:
    path: "{{ ember_install_dir }}/deploy"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy API source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../apps/api/"
    dest: "{{ ember_install_dir }}/apps/api/"
    owner: root
    group: root
    mode: preserve

- name: Copy frontend source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../apps/frontend/"
    dest: "{{ ember_install_dir }}/apps/frontend/"
    owner: root
    group: root
    mode: preserve

- name: Install Compose manifest
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../deploy/compose.yaml"
    dest: "{{ ember_install_dir }}/deploy/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Fingerprint installed build inputs
  ansible.builtin.find:
    paths:
      - "{{ ember_install_dir }}/apps"
      - "{{ ember_install_dir }}/deploy"
    recurse: true
    hidden: true
    file_type: file
    get_checksum: true
  register: ember_inputs

- name: Compare inputs with the last successfully deployed set
  ansible.builtin.template:
    src: build-inputs.j2
    dest: "{{ ember_install_dir }}/.build-inputs"
    owner: root
    group: root
    mode: "0600"
  check_mode: true
  register: ember_build_needed

- name: Reconcile Ember services
  community.docker.docker_compose_v2:
    project_src: "{{ ember_install_dir }}/deploy"
    project_name: "{{ ember_project_name }}"
    files:
      - compose.yaml
    state: present
    build: "{{ 'always' if ember_build_needed.changed else 'policy' }}"
    wait: true
    wait_timeout: 90
  environment:
    EMBER_HTTP_PORT: "{{ ember_http_port | string }}"

- name: Record successfully deployed build inputs
  ansible.builtin.template:
    src: build-inputs.j2
    dest: "{{ ember_install_dir }}/.build-inputs"
    owner: root
    group: root
    mode: "0600"
  when: ember_build_needed.changed
