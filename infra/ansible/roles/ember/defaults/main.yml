---
ember_install_dir: /opt/ember
ember_http_port: 3000
ember_project_name: ember

# Where Ember's images come from:
#   build     copy the source to the host and build the images there;
#   registry  pull the images that CI publishes (the `images` job in
#             .github/workflows/build.yml) with deploy/compose.registry.yaml.
#             The host needs no source, and every run pulls ember_image_tag
#             again, so `latest` deploys the newest build of main.
ember_image_source: build
# Registry namespace of the images, such as ghcr.io/<owner>. The images are
# <namespace>/ember-api, ember-web and ember-gateway.
ember_image_registry: ""
# `latest` (the newest build of main) or `sha-<full commit>` to pin a version.
ember_image_tag: latest
# Only for private packages: a GitHub username and a classic token with
# read:packages. Supply the token from a Vault file, never the inventory.
# Public packages need neither.
ember_registry_username: ""
ember_registry_token: ""

# Publish Ember through the Traefik ingress: attach the gateway to the shared
# internal `edge` network and label it with ember_public_host
# (deploy/compose.edge.yaml). Requires sign-in (ember_oidc_enabled). The
# homelab inventory enables it with ingress_domain.
ember_edge_enabled: false
ember_public_host: ""

# Optional OpenID Connect sign-in (docs/authentication.md). The homelab
# inventory enables it with the ingress and the Authentik stack, and derives
# these values from the same settings that render Authentik's Ember blueprint.
ember_oidc_enabled: false
ember_oidc_issuer: ""
ember_oidc_client_id: ember
ember_oidc_redirect_url: ""
ember_oidc_post_logout_redirect_url: ""
ember_oidc_allowed_groups: []
# Members of these groups get the admin role and may change plugins. Empty
# means nobody can configure or activate plugins while sign-in is on.
ember_oidc_admin_groups: []
ember_oidc_session_ttl: 8h
# Shown by the web app: the sign-in button names the provider, and the account
# page links to where people manage their own account there. Empty leaves
# them out of auth.json.
ember_oidc_provider_name: ""
ember_oidc_account_url: ""
# Supply the client secret from Vault when Authentik runs elsewhere. Otherwise
# it is read from the Authentik stack on this host, which generates it.
ember_oidc_client_secret: ""
ember_oidc_client_secret_source: /opt/stacks/authentik/secrets/ember_oidc_client_secret

# Project chat (docs/project-chat.md): run the sandbox router on this host
# (roles/sandbox_router) and let signed-in users start its agents from the
# Notes app (deploy/compose.agents.yaml). Requires ember_oidc_enabled. Agents
# use the router's trusted profile: rootless Podman, sharing the host kernel.
ember_agents_enabled: false

# With sign-in on, sessions are kept in a Redis container
# (deploy/compose.redis.yaml, ADR 014). Its password is generated on the host
# once; supply one from Vault only to set it yourself (letters, digits, - and _).
ember_redis_password: ""

# Model gateway (docs/models.md, ADR 015): LiteLLM and its PostgreSQL
# (deploy/compose.models.yaml). Provider endpoints and keys live only in the
# gateway; Ember's admin page offers its models under display names. The
# API's key for listing models and the OpenCode worker's key are LiteLLM
# virtual keys the role creates once and keeps in /opt/ember/config.
ember_models_enabled: false
# LiteLLM's model_list: each entry is {model_name, litellm_params}. Name keys
# as os.environ/NAME, never inline, and give the value in
# ember_litellm_provider_keys. For example:
#   - model_name: claude-sonnet
#     litellm_params:
#       model: anthropic/claude-sonnet-4-5
#       api_key: os.environ/ANTHROPIC_API_KEY
#   - model_name: qwen3-8b
#     litellm_params:
#       model: ollama_chat/qwen3:8b
#       api_base: http://ollama.lan:11434
ember_litellm_models: []
# Provider keys by environment variable name, such as
# {ANTHROPIC_API_KEY: "{{ vault_anthropic_api_key }}"}. Supply them from a
# Vault file, never the inventory. Names not listed here are removed.
ember_litellm_provider_keys: {}
# Generated on the host once when empty; supply them from Vault only to set
# them yourself. The master key starts with sk-; the database password holds
# letters, digits, - and _.
ember_litellm_master_key: ""
ember_litellm_db_password: ""

# An OpenCode worker for session agents (deploy/compose.opencode.yaml).
# Requires ember_oidc_enabled and ember_models_enabled. Every chat with the
# agent below is a session on this worker; chats share its workspace.
ember_opencode_enabled: false
# The agent people pick in the Notes app.
ember_opencode_agent_id: coder
ember_opencode_agent_name: Coder
# The gateway model the worker uses: a model_name of ember_litellm_models.
ember_opencode_model: ""
# Spending limit in US dollars per 30 days for the worker's gateway key; empty
# means none. Applied when the key is created (delete
# /opt/ember/config/opencode-gateway-key to create a new one).
ember_opencode_budget: ""
# Agents run tools and generated code, so the worker runs in a Kata VM
# (roles/kata). runc shares the host kernel: only for a trial on a host
# without users' data, and only with ember_opencode_allow_runc.
ember_opencode_runtime: io.containerd.kata.v2
ember_opencode_allow_runc: false
