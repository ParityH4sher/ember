---
# Shared service stacks (infra/stacks). This playbook is separate from site.yml
# on purpose: deploying, reinstalling or removing Ember never touches these
# services, and this playbook never touches Ember (DEC-006).
#
#   ansible-playbook -i inventories/homelab/hosts.yml playbooks/stacks.yml
#
# Operator secrets come from the repository's gitignored .env (.env.example).

- name: Check supported Ansible controller
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require ansible-core supported by the pinned collections
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.19', '>=')
        fail_msg: >-
          This playbook requires ansible-core 2.19 or newer for the pinned
          community.general 14.x and community.docker 5.x collections.

- name: Deploy shared service stacks
  hosts: ember_hosts
  become: true
  vars:
    shared_stacks: "{{ (shared_default_services | default([])) + (shared_optional_services | default([])) }}"
    shared_stack_names: "{{ shared_stacks | map(attribute='name') | list }}"
    # Public ingress: Cloudflare Tunnel -> cloudflared =tunnel network=> Traefik
    # =edge network=> labelled containers. Deployed only when ingress_domain is
    # set, and only after the checks below pass, because these hostnames are
    # reachable from the internet. Every route comes from container labels:
    # Authentik's from this playbook, Ember's from site.yml, which refuses to
    # label Ember without sign-in.
    ingress_enabled: "{{ (ingress_domain | default('')) | length > 0 }}"
    ingress_stacks:
      - name: traefik
      - name: cloudflared
    authentik_port: >-
      {{ ((shared_stacks | selectattr('name', 'equalto', 'authentik') | first | default({})).env
          | default({})).HTTP_PORT | default('9000') }}
    # Operator secrets can come from the repository's gitignored .env (see
    # .env.example), read on the controller. Values from a Vault file passed as
    # stack_secrets take precedence.
    repo_env_file: "{{ playbook_dir }}/../../../.env"
    stack_secrets_from_env:
      - {env: CLOUDFLARE_TUNNEL_TOKEN, stack: cloudflared, secret: cloudflare_tunnel_token}
  pre_tasks:
    - name: Read operator secrets from the repository's .env
      ansible.builtin.set_fact:
        stack_env_secrets: >-
          {{ stack_env_secrets | default({})
             | combine({item.stack: {item.secret: repo_env[item.env]}}, recursive=true) }}
      loop: "{{ stack_secrets_from_env }}"
      loop_control:
        label: "{{ item.env }}"
      vars:
        # KEY=value lines; comments and blank lines are ignored. The pattern
        # drops one optional ' or " around the value (no backreferences, which
        # Jinja string escaping would mangle).
        repo_env: >-
          {{ dict(lookup('ansible.builtin.file', repo_env_file, errors='ignore') | default('', true)
                  | regex_findall('^[ \t]*([A-Z][A-Z0-9_]*)=[ \t]*["\x27]?(.*?)["\x27]?[ \t]*$', multiline=true)) }}
      when: (repo_env[item.env] | default('')) | length > 0
      no_log: true

    # Authentik routes itself through its labels (PUBLIC_ROUTE, PUBLIC_HOST in
    # its `env`), and the host name ends up inside a Traefik Host() rule.
    - name: Require a well-formed public host for each routed stack
      ansible.builtin.assert:
        that:
          - (item.env.PUBLIC_HOST | default('')) is match('^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$')
        fail_msg: >-
          {{ item.name }} sets PUBLIC_ROUTE, so its env needs PUBLIC_HOST: a
          lowercase DNS name under ingress_domain.
        quiet: true
      loop: "{{ shared_stacks }}"
      loop_control:
        label: "{{ item.name }}"
      when: (item.env.PUBLIC_ROUTE | default('false') | string | lower) == 'true'
  roles:
    - role: container-runtime
      tags: [container-runtime]
    # The internal `tunnel` and `edge` networks. Always created, because stacks
    # such as Authentik attach their front container to `edge`.
    - role: ingress_networks
  tasks:
    # `public` exposes the role's defaults, such as stacks_root, to the tasks
    # below. Defaults of an included role are otherwise private to it.
    - name: Deploy each shared service stack
      ansible.builtin.include_role:
        name: stack
        public: true
      loop: "{{ shared_stacks }}"
      loop_control:
        loop_var: stack
        label: "{{ stack.name }}"

    # Until akadmin has a usable password, Authentik's initial-setup flow lets
    # anyone who reaches it claim the administrator account (policy
    # default-oobe-password-usable). Never publish it in that state. Ask
    # Authentik directly: an HTTP probe cannot tell, because the flow denies
    # API requests that were not started from the setup page, and it does not
    # exist yet in the first seconds after a fresh install.
    - name: Check whether Authentik's administrator account is claimed
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ stacks_root }}/authentik"
          - exec
          - -T
          - worker
          - ak
          - shell
          - -c
          - >-
            from authentik.core.models import User;
            u = User.objects.filter(username="akadmin").first();
            print("claimed" if u is not None and u.has_usable_password() else "unclaimed")
      register: authentik_admin_state
      changed_when: false
      when:
        - ingress_enabled | bool
        - "'authentik' in shared_stack_names"

    - name: Require a claimed Authentik administrator before publishing
      ansible.builtin.assert:
        that:
          - authentik_admin_state.stdout is search('^claimed$', multiline=true)
        fail_msg: >-
          Authentik's administrator account (akadmin) has no password yet, so
          nothing was published. Open an SSH tunnel (ssh -L
          9000:127.0.0.1:{{ authentik_port }} {{ inventory_hostname }}), open
          http://localhost:9000/ to finish the initial setup, and rerun this
          playbook. Keep the akadmin account (deactivate it if you like): this
          check requires it to exist with a password.
        quiet: true
      when:
        - ingress_enabled | bool
        - "'authentik' in shared_stack_names"

    # Earlier versions rendered curated routes into this file. Every route now
    # comes from labels, so remove it before Traefik starts or reloads.
    - name: Remove the curated routes of earlier versions
      ansible.builtin.file:
        path: "{{ stacks_root }}/traefik/dynamic/routes.yml"
        state: absent
      when: ingress_enabled | bool

    - name: Deploy the public ingress
      ansible.builtin.include_role:
        name: stack
      loop: "{{ ingress_stacks }}"
      loop_control:
        loop_var: stack
        label: "{{ stack.name }}"
      when: ingress_enabled | bool
