---
ember_install_dir: /opt/ember
ember_http_port: 3000
ember_compose_command: docker compose

# Run the images that CI publishes for every push to main instead of building
# on the Pi. Each site.yml run pulls ember_image_tag again: `latest` follows
# main, and `sha-<full commit>` pins (or rolls back to) one build. Images exist
# only for commits pushed to main after the `images` job was added. If the
# packages are private, pass ember_registry_username and ember_registry_token
# (read:packages) from a Vault file.
ember_image_source: registry
ember_image_registry: ghcr.io/parityh4sher
ember_image_tag: latest

# Shared service stacks (infra/stacks), deployed only by playbooks/stacks.yml.
# Defaults cannot be deactivated in Ember; optional services are integrations.
# `env` becomes the stack's .env (non-secret). Secrets go in a Vault file as
# stack_secrets.<stack>.<secret>; see roles/stack/defaults/main.yml.
shared_default_services:
  - name: authentik
    env:
      HTTP_PORT: "9000"
shared_optional_services: []

# Public ingress through a Cloudflare Tunnel. While ingress_domain is empty,
# nothing is public: Tailscale Serve publishes Ember on the tailnet, and the
# stacks are reachable only on the host's loopback interface.
# Setting a Cloudflare zone PUBLISHES THE ROUTES BELOW ON THE INTERNET, with
# Ember sign-in through Authentik (infra/stacks/cloudflared/README.md):
#   1. in Cloudflare Zero Trust, give the tunnel a public hostname for each
#      route host below, each with service HTTP -> traefik:8081;
#   2. put CLOUDFLARE_TUNNEL_TOKEN in the repository's gitignored .env;
#   3. run stacks.yml. It refuses to publish until Authentik's admin account is
#      claimed (set it up over SSH), and Authentik generates Ember's client secret;
#   4. run stacks.yml again, then site.yml to configure Ember's sign-in.
# Keep hosts one level below the zone: Cloudflare's free certificate covers
# ember-poc.example.com, not ember.home.example.com.
ingress_domain: parityh4sher.org
# Public host names. They are used for the routes, Ember's URLs and the OIDC
# issuer, so the three can never disagree.
ember_public_host: "ember-poc.{{ ingress_domain }}"
authentik_public_host: "auth.{{ ingress_domain }}"
# Traefik reaches services on the internal `edge` network by container alias.
# A service joins `edge` with an alias in its Compose file (Ember:
# deploy/compose.edge.yaml, Authentik: infra/stacks/authentik/compose.yaml).
ingress_routes:
  - name: ember
    host: "{{ ember_public_host }}"
    url: "http://ember-gateway:8080"
  - name: authentik
    host: "{{ authentik_public_host }}"
    url: "http://authentik:9000"
# Put Ember's gateway on `edge` whenever the ingress is on.
ember_edge_enabled: "{{ ingress_domain | length > 0 }}"

# Ember sign-in (docs/authentication.md). site.yml writes these into Ember's
# auth.json; stacks.yml renders the matching client into Authentik as a
# blueprint, so both sides always agree.
ember_public_url: "https://{{ ember_public_host }}"
ember_oidc_enabled: >-
  {{ (ingress_domain | length > 0)
     and ('authentik' in (shared_default_services | map(attribute='name'))) }}
ember_oidc_issuer: "https://{{ authentik_public_host }}/application/o/ember/"
ember_oidc_client_id: ember
ember_oidc_redirect_url: "{{ ember_public_url }}/api/v1/auth/callback"
ember_oidc_post_logout_redirect_url: "{{ ember_public_url }}/"
# Leave empty to admit every Authentik user, or name the groups allowed in.
ember_oidc_allowed_groups: []
