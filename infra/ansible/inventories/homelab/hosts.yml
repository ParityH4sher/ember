---
all:
  children:
    ember_hosts:
      hosts:
        pi:
          # The Pi's Tailscale address (machine "ember-poc"): reachable from
          # anywhere on the tailnet, including the home network. To use the
          # LAN address instead, run with EMBER_PI_HOST=192.168.1.205.
          ansible_host: "{{ lookup('ansible.builtin.env', 'EMBER_PI_HOST', default='100.85.25.80') }}"
          ansible_user: ubuntu
          ansible_password: "123456"
