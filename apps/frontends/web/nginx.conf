# Static file server for the web app. The gateway (deploy/gateway) proxies
# every non-API path here. Unknown paths get the app's own 404 page with a
# 404 status; SvelteKit renders it inside the shell.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /404.html {
        internal;
    }
}
