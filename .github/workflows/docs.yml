name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - contracts/**
      - website/**
      - .nvmrc
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - contracts/**
      - website/**
      - .nvmrc
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Read GitHub Pages configuration
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm --prefix website ci --no-audit --no-fund

      - name: Build documentation
        run: npm --prefix website run build
        env:
          DOCS_URL: ${{ steps.pages.outputs.origin }}
          DOCS_BASE_URL: ${{ github.event_name == 'pull_request' && '/ember' || steps.pages.outputs.base_path }}/

      - name: Verify published contract files match the originals
        run: |
          cmp contracts/openapi.yaml website/build/openapi.yaml
          cmp contracts/project-schema/v1.schema.json website/build/project-schema/v1.schema.json

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
