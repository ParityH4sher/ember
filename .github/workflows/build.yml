name: Build and test Ember

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - run: go vet ./... && go test -race ./...
        working-directory: apps/api

  bundle:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble portable Compose bundle
        run: bash deploy/build-bundle.sh dist "$GITHUB_SHA"
      - name: Check the extracted bundle through its public proxy
        run: bash deploy/test-bundle.sh dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ember-compose-bundle
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 30
