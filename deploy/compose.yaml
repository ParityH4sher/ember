name: ember

services:
  api:
    build:
      context: ../apps/api
    environment:
      EMBER_LISTEN_ADDR: 0.0.0.0:8080
      EMBER_SERVICE_LINKS: "${EMBER_SERVICE_LINKS:-[]}"
      EMBER_GITEA_REPOSITORY_URL: "${EMBER_GITEA_REPOSITORY_URL:-}"
    read_only: true
    volumes:
      - projects:/var/lib/ember/projects
      - ai:/var/lib/ember/ai
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - backend

  web: # The browser app (apps/frontends/web) as static files; the gateway serves it at /.
    build:
      context: ../apps/frontends/web
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 1.0
    restart: unless-stopped
    networks:
      - backend

  frontend: # Shared loopback gateway for Tailscale Serve.
    build:
      context: ./gateway
    depends_on:
      - api
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EMBER_HTTP_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/api/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  projects:
  # The admin AI catalog: model providers (with their API keys), models and
  # agents. Back it up like a secret.
  ai:
