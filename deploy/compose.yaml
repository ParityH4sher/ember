name: ember

services:
  api:
    build:
      context: ./apps/api
    environment:
      EMBER_LISTEN_ADDR: 0.0.0.0:8080
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - backend

  frontend:
    build:
      context: ./apps/frontend
    depends_on:
      - api
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EMBER_HTTP_PORT:-3000}:8080"
    networks:
      - backend

networks:
  backend:
    driver: bridge
