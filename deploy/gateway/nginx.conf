log_format ember_json escape=json
    '{"event":"proxy.request","request_id":"$upstream_http_x_request_id",'
    '"status":$status,"duration_s":$request_time}';

upstream ember_api {
    zone ember_api 64k;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=5s;
    resolver_timeout 2s;
    server api:8080 resolve;
}

upstream ember_web {
    zone ember_web 64k;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=5s;
    server web:80 resolve;
}

server {
    access_log /var/log/nginx/access.log ember_json;
    listen 8080;
    server_name _;
    # Redirect with a relative Location. An absolute one would name this
    # container's port 8080, not the published port or the Serve/Traefik origin.
    absolute_redirect off;

    location /api/ {
        proxy_connect_timeout 2s;
        proxy_pass http://ember_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Every page path ends in a slash. Redirect here, keeping note deep links:
    # a directory redirect from the web container would name its own host.
    location = /apps/notes {
        return 308 /apps/notes/$is_args$args;
    }
    location ~ ^/(login|plugins|settings|account|admin)$ {
        return 308 $uri/$is_args$args;
    }

    # The web app (pages, assets, manifest and service worker). no-cache makes
    # browsers revalidate, so a new deployment and its service worker are seen.
    location / {
        proxy_pass http://ember_web;
        add_header Cache-Control "no-cache";
    }
}
