log_format ember_json escape=json
    '{"event":"proxy.request","request_id":"$upstream_http_x_request_id",'
    '"status":$status,"duration_s":$request_time}';

upstream ember_api {
    zone ember_api 64k;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=5s;
    resolver_timeout 2s;
    server api:8080 resolve;
}

upstream ember_home {
    zone ember_home 64k;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=5s;
    server home:80 resolve;
}

upstream ember_notes {
    zone ember_notes 64k;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=5s;
    server notes:80 resolve;
}

server {
    access_log /var/log/nginx/access.log ember_json;
    listen 8080;
    server_name _;

    location /api/ {
        proxy_connect_timeout 2s;
        proxy_pass http://ember_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve the notes PWA at its canonical scope, including note deep links.
    location = /apps/notes {
        return 308 /apps/notes/$is_args$args;
    }
    location ^~ /apps/notes/ {
        proxy_pass http://ember_notes;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://ember_home;
    }
}
