# Example LiteLLM configuration for deploy/compose.models.yaml (docs/models.md).
# Copy it outside the bundle, edit it, and set EMBER_LITELLM_CONFIG_FILE to the
# copy. Never write a key here: name it as os.environ/NAME and put the key in a
# file called NAME in EMBER_LITELLM_SECRETS_DIR.
#
# Each model_name is what Ember's admin page lists and offers, what agents ask
# for, and what an OpenCode worker's EMBER_OPENCODE_MODEL names.
model_list:
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  # A model on your network. LiteLLM reaches it over models-egress, so use an
  # address the container can resolve, not localhost.
  - model_name: qwen3-8b
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://ollama.lan:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  # Do not send usage telemetry, and do not log prompts or answers.
  telemetry: false
  turn_off_message_logging: true
  drop_params: true
