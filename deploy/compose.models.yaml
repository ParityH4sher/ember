# Overlay: the model gateway (LiteLLM, DEC-007, ADR 015; guide: docs/models.md).
# Provider endpoints and keys live here, never in Ember: the admin page only
# offers the gateway's models under display names. install.sh adds this overlay
# when EMBER_LITELLM_CONFIG_FILE is set. Without the installer:
#   docker compose -f deploy/compose.yaml -f deploy/compose.models.yaml up -d
#
# EMBER_LITELLM_CONFIG_FILE     absolute host path of LiteLLM's config.yaml
#                               (start from deploy/litellm/config.example.yaml).
#                               It names keys as os.environ/NAME, never inline.
# EMBER_LITELLM_SECRETS_DIR     absolute host directory of LiteLLM's secrets,
#                               one file per environment variable: the file
#                               name is the variable name, the first line its
#                               value. It needs LITELLM_MASTER_KEY (starting
#                               with sk-) and POSTGRES_PASSWORD (letters,
#                               digits, - and _), plus each provider key the
#                               config names, such as ANTHROPIC_API_KEY.
#                               Readable by UID 65534; POSTGRES_PASSWORD is also
#                               read by Postgres (UID 70), so make it group 70
#                               with mode 0440.
# EMBER_MODEL_GATEWAY_KEY_FILE  absolute host path of the key the Ember API uses
#                               to list the gateway's models: a LiteLLM virtual
#                               key (or, less safely, the master key). Readable
#                               by UID 65532.
#
# Networks: the API reaches LiteLLM on the internal `models` network; Postgres
# is on the internal `models-db` network with LiteLLM only; only LiteLLM joins
# `models-egress`, the one network with a route out, to reach providers.
services:
  api:
    environment:
      EMBER_MODEL_GATEWAY_URL: http://litellm:4000
      EMBER_MODEL_GATEWAY_KEY_FILE: /run/secrets/ember-model-gateway-key
    volumes:
      - type: bind
        source: ${EMBER_MODEL_GATEWAY_KEY_FILE:?set EMBER_MODEL_GATEWAY_KEY_FILE to the host path of the API's gateway key}
        target: /run/secrets/ember-model-gateway-key
        read_only: true
        bind:
          create_host_path: false
    networks:
      models: {}

  litellm:
    # The non-root LiteLLM image (UID 65534), LTS line. Pinned by the
    # multi-architecture index digest, checked against ghcr.io on 2026-11-28.
    # The release is signed; verify before upgrading:
    #   cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
    #     --certificate-identity https://github.com/BerriAI/project-releaser/.github/workflows/release.yml@refs/heads/main \
    #     ghcr.io/berriai/litellm-non_root:<tag>
    image: ghcr.io/berriai/litellm-non_root:v1.108.20@sha256:ff2a43d337563672cde1d26d9b53fcf0bd90758cc9a33765ba3e8114a2b13d67
    user: "65534:65534"
    # Export each secret file as an environment variable of the LiteLLM
    # process only, so keys never appear in this file, `docker inspect` or a
    # command line. The database URL is built here for the same reason.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for file in /run/secrets/litellm/*; do
          [ -f "$$file" ] || continue
          name=$${file##*/}
          case "$$name" in
            [A-Z]*) ;;
            *) echo "Skipping secret file $$name: name it like an environment variable." >&2; continue ;;
          esac
          case "$$name" in
            *[!A-Z0-9_]*) echo "Skipping secret file $$name: name it like an environment variable." >&2; continue ;;
          esac
          value=
          IFS= read -r value < "$$file" || true
          export "$$name=$$value"
        done
        unset value
        case "$${LITELLM_MASTER_KEY:-}" in
          sk-?*) ;;
          *) echo "LITELLM_MASTER_KEY must exist in the secrets directory and start with sk-." >&2; exit 1 ;;
        esac
        case "$${POSTGRES_PASSWORD:-}" in
          ""|*[!A-Za-z0-9_-]*) echo "POSTGRES_PASSWORD must exist and hold letters, digits, - and _." >&2; exit 1 ;;
        esac
        export DATABASE_URL="postgresql://litellm:$${POSTGRES_PASSWORD}@litellm-db:5432/litellm"
        unset POSTGRES_PASSWORD
        exec /app/docker/prod_entrypoint.sh --config /etc/litellm/config.yaml --host 0.0.0.0 --port 4000
    environment:
      # Use the price list shipped in the image instead of fetching it from
      # GitHub at every start.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      # Operators configure models in config.yaml and keys through the API;
      # the admin UI and the OpenAPI page are not needed.
      DISABLE_ADMIN_UI: "True"
      NO_DOCS: "True"
      STORE_MODEL_IN_DB: "False"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.cache:uid=65534,gid=65534,mode=0700,size=64m
    volumes:
      - type: bind
        source: ${EMBER_LITELLM_CONFIG_FILE:?set EMBER_LITELLM_CONFIG_FILE to the host path of LiteLLM's config.yaml}
        target: /etc/litellm/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${EMBER_LITELLM_SECRETS_DIR:?set EMBER_LITELLM_SECRETS_DIR to the host directory of LiteLLM's secrets}
        target: /run/secrets/litellm
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      litellm-db:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    expose:
      - "4000"
    healthcheck:
      # The image has Python but no curl or wget.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      models: {}
      models-db: {}
      models-egress: {}

  # LiteLLM keeps its virtual keys, budgets and spend in Postgres. Virtual keys
  # are what let the API and each worker hold a key limited to their models.
  litellm-db:
    # Pinned by the multi-architecture index digest, checked against Docker Hub
    # on 2026-11-28.
    image: docker.io/library/postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    # The image's postgres user. The volume starts with the image's
    # postgres-owned /var/lib/postgresql, so no root step is needed.
    user: "70:70"
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    read_only: true
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=0775,size=1m
      - /tmp:size=16m,mode=1777
    volumes:
      - litellm-db:/var/lib/postgresql
      - type: bind
        source: ${EMBER_LITELLM_SECRETS_DIR:?set EMBER_LITELLM_SECRETS_DIR to the host directory of LiteLLM's secrets}/POSTGRES_PASSWORD
        target: /run/secrets/postgres-password
        read_only: true
        bind:
          create_host_path: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "/var/run/postgresql", "-U", "litellm", "-d", "litellm"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      models-db: {}

networks:
  # Internal: the API and LiteLLM only.
  models:
    internal: true
  # Internal: LiteLLM and its database only.
  models-db:
    internal: true
  # The route to model providers; only LiteLLM is attached.
  models-egress: {}

volumes:
  # Virtual keys (stored hashed), budgets and spend. Back it up.
  litellm-db:
