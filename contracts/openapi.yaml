openapi: 3.1.0
info:
  title: Ember API
  version: 0.1.0
  description: >-
    This prototype stores project records and Markdown notes on disk.
    Plugin configuration is process-local. OpenID Connect sign-in is optional
    and off by default; without it there is no authentication, so do not expose
    the API to an untrusted network or use real credentials. When the operator
    configures sign-in, every route except /healthz and /v1/auth/* requires the
    session cookie, state-changing requests must come from the configured
    browser origin, and signed-in access pauses while the identity provider is
    unreachable. Each signed-in user has a role taken from identity provider
    groups: user (read Ember, use projects, notes and chats, call plugin operations)
    or admin (also configure and activate plugins). Without sign-in every
    caller is an admin. Roles do not yet distinguish projects.
    Plugin configuration and plugin operations are prototype behavior; only the
    Weather plugin currently makes a fixed upstream request. Other listed
    plugins may be configuration-only. Project chat runs an operator-registered
    agent in the sandbox router; it is off unless the operator configures
    agents, and the API then refuses to start without sign-in unless the
    operator explicitly allows it for loopback development.
servers:
  - url: http://localhost:3000/api
security:
  - {}
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check API process health
      security: []
      responses:
        "200":
          description: API process is running
          headers:
            X-Request-ID:
              description: Server-generated identifier for correlating the response with the API access log.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                version: development
  /v1/auth/session:
    get:
      operationId: getAuthSession
      summary: Report whether sign-in is enabled and who is signed in
      description: >-
        Always available, so browser clients can decide whether to offer
        sign-in. A stale or unknown session cookie is cleared. With sign-in
        enabled, `provider` names the identity provider for signed-out and
        signed-in callers alike when the operator configured providerName or
        accountUrl.
      security: []
      responses:
        "200":
          description: Current sign-in state
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
              examples:
                disabled:
                  value: {enabled: false, authenticated: false}
                signedOut:
                  value:
                    enabled: true
                    authenticated: false
                    provider: {name: Authentik, accountUrl: "https://auth.example.com/if/user/"}
                signedIn:
                  value:
                    enabled: true
                    authenticated: true
                    provider: {name: Authentik, accountUrl: "https://auth.example.com/if/user/"}
                    user: {subject: 3f9c, name: Ada Lovelace, email: ada@example.com, groups: [makers]}
                    role: user
                    expiresAt: "2026-11-21T20:00:00Z"
        "503":
          $ref: "#/components/responses/SessionStoreUnavailable"
  /v1/auth/login:
    get:
      operationId: startLogin
      summary: Start OpenID Connect sign-in
      description: >-
        Browser navigation, not a fetch. Redirects to the identity provider's
        authorization endpoint (authorization code flow with PKCE and a nonce)
        and sets a short-lived, HttpOnly state cookie.
      security: []
      parameters:
        - name: returnTo
          in: query
          description: Local path to open after sign-in. Anything other than an absolute path on this origin is replaced with /.
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to the identity provider
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          $ref: "#/components/responses/AuthNotConfigured"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
  /v1/auth/callback:
    get:
      operationId: completeLogin
      summary: Complete OpenID Connect sign-in
      description: >-
        The identity provider redirects here; register this URL, including the
        gateway's /api prefix, as the client's redirect URI. Ember checks the
        state cookie, redeems the code, validates the ID token (signature,
        issuer, audience, expiry and nonce), applies the optional group policy,
        and sets an HttpOnly session cookie. Tokens are never sent to the browser.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by the identity provider when sign-in did not complete.
          schema:
            type: string
      responses:
        "303":
          description: Signed in; redirect to the requested local path
          headers:
            Location:
              schema:
                type: string
        "400":
          description: Missing, expired or mismatched sign-in state, or no authorization code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The provider refused sign-in or returned an invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The user is not in an allowed group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/AuthNotConfigured"
        "502":
          description: The authorization code could not be redeemed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
  /v1/auth/logout:
    post:
      operationId: logout
      summary: End the Ember session
      description: >-
        Removes the server-side session and clears its cookie. When the provider
        advertises an end_session_endpoint, the response includes a URL that ends
        the provider session too; navigate the browser there.
      security: []
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResult"
        "403":
          $ref: "#/components/responses/CrossOriginRequest"
        "404":
          $ref: "#/components/responses/AuthNotConfigured"
        "503":
          $ref: "#/components/responses/SessionStoreUnavailable"
  /v1/projects/{projectId}:
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: Removes the active project record. Notes stay on disk and the identifier remains reserved.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOriginRequest"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "204":
          description: Project deleted
        "404":
          description: Project does not exist or is not visible to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Project cannot currently be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/projects:
    get:
      operationId: listProjects
      summary: List active projects
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "200":
          description: Projects registered on this instance
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      summary: Create a project and seed its Markdown index and handoff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id:
                  type: string
                  pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$'
                name:
                  type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOriginRequest"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "201":
          description: Project record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Project identifier already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/projects/{projectId}/notes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectNotes
      summary: Load Markdown notes for this project's browser link index
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "200":
          description: Project-relative paths mapped to Markdown text
          content:
            application/json:
              schema:
                type: object
                required: [notes]
                properties:
                  notes:
                    type: object
                    additionalProperties: {type: string}
        "404": {description: Project not found}
        "413": {description: Vault exceeds text or size limits}
    put:
      operationId: saveProjectNote
      summary: Create or replace one Markdown note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path, content]
              properties:
                path: {type: string, description: Relative non-hidden .md path within the project's notes directory}
                content: {type: string}
                previous: {type: [string, "null"], description: Exact last-read text for replacement; omit or use null for creation}
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOriginRequest"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "204": {description: Note saved}
        "400": {description: Invalid note path or body}
        "404": {description: Project not found}
        "409": {description: Stored content differs from the supplied previous content}
        "413": {description: Note or project exceeds the size limit}
  /v1/agents:
    get:
      operationId: listAgents
      summary: Agents available for project chat
      description: >-
        Chat runs are off unless the operator supplies an agents configuration
        file (EMBER_AGENTS_CONFIG_FILE) naming the sandbox router. The list has
        the agents in that file followed by the enabled agents admins added
        under /v1/admin/ai/agents. It never includes gateway endpoints or keys.
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "200":
          description: Whether chat runs are on, and the agents a chat may use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
  /v1/admin/ai:
    get:
      operationId: getAICatalog
      summary: Models, agents, workers and gateway status (admin)
      description: >-
        Requires the admin role. Providers and their keys are configured in the
        model gateway (LiteLLM), never in Ember (ADR 015), so nothing here is
        secret.
      responses:
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/AdminWriteForbidden"}
        "200":
          description: The catalog
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AICatalog"}
  /v1/admin/ai/gateway/models:
    get:
      operationId: listGatewayModels
      summary: List the models the model gateway offers (admin)
      description: >-
        The API calls GET {EMBER_MODEL_GATEWAY_URL}/v1/models with the gateway
        key from EMBER_MODEL_GATEWAY_KEY_FILE, following no redirects, with a
        10 s timeout. Names the catalog cannot store are left out. The
        gateway's error bodies are never passed on.
      responses:
        "200":
          description: Gateway model names, sorted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [models]
                properties:
                  models:
                    type: array
                    maxItems: 500
                    items:
                      type: object
                      additionalProperties: false
                      required: [id]
                      properties:
                        id: {type: string, description: "The gateway's model name."}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/AdminWriteForbidden"}
        "503":
          description: "gateway_unavailable: no gateway is configured, or it is unreachable, refused the key or did not answer with a model list"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/admin/ai/models/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The gateway's model name; a "/" in it is sent as %2F.
        schema: {type: string, maxLength: 200, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/@-]*$'}
    put:
      operationId: putCatalogModel
      summary: Offer a gateway model under a display name (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, maxLength: 80}
      responses:
        "200":
          description: The saved model
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogModel"}
        "400": {description: Malformed body}
        "403": {$ref: "#/components/responses/AdminWriteForbidden"}
        "422": {description: invalid_configuration}
    delete:
      operationId: deleteCatalogModel
      summary: Stop offering a model (admin)
      responses:
        "204": {description: Deleted}
        "403": {$ref: "#/components/responses/AdminWriteForbidden"}
        "404": {description: No such model}
        "409": {description: "in_use: an agent still lists this model"}
  /v1/admin/ai/agents/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}}
    put:
      operationId: putCatalogAgent
      summary: Create or replace an agent (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, harness, enabled]
              properties:
                name: {type: string}
                harness: {type: string}
                routerAgent: {type: string, description: Required unless harness is opencode.}
                worker: {type: string, description: Required when harness is opencode.}
                models: {type: array, items: {type: string}}
                defaultModel: {type: string}
                enabled: {type: boolean}
      responses:
        "200":
          description: The saved agent
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogAgent"}
        "403": {$ref: "#/components/responses/AdminWriteForbidden"}
        "422": {description: invalid_configuration}
    delete:
      operationId: deleteCatalogAgent
      summary: Delete an agent (admin); its chats stay readable
      responses:
        "204": {description: Deleted}
        "403": {$ref: "#/components/responses/AdminWriteForbidden"}
        "404": {description: No such agent}
  /v1/projects/{projectId}/chats:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectChats
      summary: List the project's chats, most recently updated first
      description: Works while chat runs are off; transcripts are project files.
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "200":
          description: Chat summaries without message text
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [chats]
                properties:
                  chats:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatSummary"
        "404":
          description: "Project not found (project_not_found)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createProjectChat
      summary: Start a chat with a registered agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agent]
              properties:
                agent:
                  type: string
                  description: ID of an agent listed by GET /v1/agents
                title:
                  type: string
                  maxLength: 120
                  description: Optional. Defaults to the start of the first message.
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOriginRequest"
        "201":
          description: Chat created with no messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "400":
          description: "Invalid body (invalid_chat) or an agent that is not registered (unknown_agent)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Project not found (project_not_found)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The project already has the maximum of 100 chats (chat_limit)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            Chat runs are off on this instance (agents_unavailable), or the
            identity provider is unreachable (identity_provider_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/projects/{projectId}/chats/{chatId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ChatId"
    get:
      operationId: getProjectChat
      summary: Load one chat with all its messages
      description: >-
        Poll this while an agent message is pending. A pending message whose run
        is no longer in progress, for example after an API restart, is returned
        as failed with an interruption error.
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "200":
          description: The chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "404":
          description: "Project or chat not found (project_not_found, chat_not_found)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/projects/{projectId}/chats/{chatId}/messages:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ChatId"
    post:
      operationId: sendProjectChatMessage
      summary: Send a message and start one sandboxed agent run
      description: >-
        Saves the message and a pending agent message, then returns at once.
        The API runs the chat's agent once in the sandbox router with the
        conversation (oldest messages are left out when it would exceed the
        router's 32 KiB input limit) and replaces the pending message with the
        answer or a failure. Poll GET /v1/projects/{projectId}/chats/{chatId}
        until no message is pending. Nothing is saved when the request is
        refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content:
                  type: string
                  description: Non-empty UTF-8 text without NUL, at most 16 KiB.
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOriginRequest"
        "202":
          description: Message saved and agent run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "400":
          description: "Empty or invalid message (invalid_message)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Project or chat not found (project_not_found, chat_not_found)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "This chat already has a run in progress (chat_busy)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: >-
            The message is too large to send to the agent (message_too_large),
            or the chat reached its 1 MiB size limit (chat_full)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Another chat is using the agent runner (agent_busy); retry later"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            Chat runs are off on this instance (agents_unavailable), or the
            identity provider is unreachable (identity_provider_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/services:
    get:
      operationId: listServiceLinks
      summary: Public browser links to operator-configured shared services
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "200":
          description: Read-only service directory; empty when no links are configured.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      required: [name, url]
                      properties:
                        name: {type: string}
                        url: {type: string, format: uri}
  /v1/plugins:
    get:
      operationId: listPlugins
      summary: List plugins available to this Ember deployment
      description: >-
        Lists only plugins included and enabled for discovery by the server
        deployment. A plugin not included in the deployment must not be
        advertised or have its client code delivered. This endpoint reports
        backend-provided capabilities and configuration schemas; it does not
        transfer executable plugin code to the browser.
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "200":
          description: Available plugin integrations
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [plugins]
                properties:
                  plugins:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plugin"
  /v1/plugins/{pluginId}:
    get:
      operationId: getPlugin
      summary: Get an available plugin and its current configuration state
      description: Returns configuration values safe for display; secret values are never returned.
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "200":
          description: Plugin metadata and current non-secret configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "404":
          description: Plugin is not included in or available to this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/plugins/{pluginId}/activation:
    put:
      operationId: setPluginActivation
      summary: Activate or deactivate an available plugin
      description: >-
        Sets this instance's activation flag for the integration. Requires the
        admin role. This prototype does not yet perform upstream service
        operations. Deactivation does not stop or modify the independently
        operated upstream service.
      parameters:
        - $ref: "#/components/parameters/PluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [active]
              properties:
                active:
                  type: boolean
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminWriteForbidden"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "200":
          description: Activation state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "404":
          description: Plugin is not included in or available to this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Plugin cannot be activated until its configuration is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/plugins/{pluginId}/configuration:
    get:
      operationId: getPluginConfiguration
      summary: Get the safe-to-display plugin configuration
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "200":
          description: Current non-secret configuration values and configuration schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginConfiguration"
        "404":
          description: Plugin is not included in or available to this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: setPluginConfiguration
      summary: Replace plugin-specific configuration
      description: >-
        All plugins use this common configuration envelope, while each plugin
        supplies its own JSON Schema describing the fields in values. The
        backend validates values against that schema. Secret inputs must be
        write-only and stored server-side; responses must never disclose secret
        values. Configuration connects this Ember instance to an upstream
        service (for example, Immich); it does not install or operate that
        service. Requires the admin role.
      parameters:
        - $ref: "#/components/parameters/PluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [values]
              properties:
                values:
                  type: object
                  description: Plugin-specific values validated against its advertised configurationSchema.
                  additionalProperties: true
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminWriteForbidden"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "200":
          description: Configuration saved; returned values are safe to display and contain no secret material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginConfiguration"
        "404":
          description: Plugin is not included in or available to this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Values do not satisfy the plugin configuration schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/plugins/{pluginId}/api:
    get:
      operationId: listPluginOperations
      summary: List the API operations exposed by an available plugin
      description: >-
        Returns only operations explicitly implemented and allowlisted by this
        plugin. The frontend uses Ember API operation URLs;
        upstream service origins, paths, and credentials remain private to the
        backend.
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "200":
          description: Frontend-facing operation catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginApiCatalog"
        "404":
          description: Plugin is not included in or available to this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/plugins/{pluginId}/api/{apiVersion}/{operationId}:
    post:
      operationId: invokePluginOperation
      summary: Invoke an allowlisted plugin operation
      description: >-
        The backend resolves operationId and apiVersion against the plugin's
        registered operation definitions, validates inputs, and routes the
        request to that operation's fixed upstream service route. Clients
        cannot supply an upstream URL, path, HTTP method, or credential. Any
        signed-in user (user or admin role) may invoke an operation of an
        active plugin. The backend must enforce caller authorization, plugin
        activation, destination policy, operation scopes, timeouts, response limits, and
        audit policy before forwarding. This must not be an unrestricted
        reverse proxy.
      parameters:
        - $ref: "#/components/parameters/PluginId"
        - name: apiVersion
          in: path
          required: true
          schema:
            type: string
        - name: operationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginOperationInput"
            example:
              pathParams: {}
              query: {}
              body:
                latitude: 47.6
                longitude: -122.3
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOriginRequest"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
        "200":
          description: Plugin operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginOperationResult"
        "404":
          description: Plugin or operation is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Plugin is not active or configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Operation input is invalid or denied by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream service operation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Operation is declared but its adapter is not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ember_session
      description: >-
        Opaque session ID set by /v1/auth/callback when OpenID Connect sign-in
        is configured. Over plain HTTP (loopback development only) the cookie is
        named ember_session. Sessions are held in API memory, expire after the
        configured sessionTtl, and end when the API restarts.
  responses:
    Unauthenticated:
      description: Sign-in is configured and the request has no valid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: {code: unauthenticated, message: sign in to use Ember}
    CrossOriginRequest:
      description: Sign-in is configured and a state-changing request came from another origin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: {code: cross_origin_request, message: cross-origin writes are not allowed}
    AdminWriteForbidden:
      description: >-
        Sign-in is configured and either the request came from another origin
        or the signed-in user does not have the admin role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            crossOrigin:
              value: {code: cross_origin_request, message: cross-origin writes are not allowed}
            notAdmin:
              value: {code: insufficient_role, message: this action needs the Ember admin role}
    IdentityProviderUnavailable:
      description: >-
        The identity provider or the session store (Redis) is unreachable;
        sign-in and signed-in access are paused until it returns
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            identityProvider:
              value: {code: identity_provider_unavailable, message: the sign-in service is unavailable}
            sessionStore:
              value: {code: session_store_unavailable, message: the session store is unavailable; sign-in is paused until it returns}
    SessionStoreUnavailable:
      description: >-
        The session store (Redis) is unreachable. The session cookie is kept;
        retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: {code: session_store_unavailable, message: the session store is unavailable; sign-in is paused until it returns}
    AuthNotConfigured:
      description: Sign-in is not configured on this instance
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: {code: auth_not_configured, message: sign-in is not configured on this Ember instance}
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    PluginId:
      name: pluginId
      in: path
      required: true
      schema:
        type: string
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{16}$'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    AuthUser:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          type: string
          description: The identity provider's stable subject identifier (sub claim).
        name:
          type: string
        email:
          type: string
        groups:
          type: array
          items:
            type: string
    AuthSession:
      type: object
      additionalProperties: false
      required: [enabled, authenticated]
      properties:
        enabled:
          type: boolean
          description: Whether OpenID Connect sign-in is configured.
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/AuthUser"
        role:
          type: string
          enum: [user, admin]
          description: >-
            Present when authenticated. Decided at sign-in from the user's
            groups (adminGroups and allowedGroups); a group change takes effect
            at the next sign-in.
        expiresAt:
          type: string
          format: date-time
        provider:
          $ref: "#/components/schemas/AuthProvider"
    AuthProvider:
      type: object
      additionalProperties: false
      description: >-
        The identity provider, present only when sign-in is enabled and the
        operator set providerName or accountUrl. Each member is omitted when
        not configured.
      properties:
        name:
          type: string
          maxLength: 64
          description: Display name, such as Authentik.
        accountUrl:
          type: string
          format: uri
          description: Where people manage their own account at the provider.
    LogoutResult:
      type: object
      additionalProperties: false
      properties:
        endSessionUrl:
          type: string
          format: uri
          description: Identity provider logout URL, present when the provider supports RP-initiated logout.
    Project:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Plugin:
      type: object
      additionalProperties: false
      required: [id, name, version, apiVersion, active, configured, capabilities, configurationSchema, configuration]
      properties:
        id:
          type: string
          description: Stable plugin identifier, such as immich.
        name:
          type: string
        version:
          type: string
          description: Plugin implementation version using semantic versioning.
        apiVersion:
          type: string
          description: Plugin HTTP contract major version used in invocation routes, e.g. 1.
        description:
          type: string
        active:
          type: boolean
        configured:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
        configurationSchema:
          type: object
          description: JSON Schema describing this plugin's distinct values object.
          additionalProperties: true
        configuration:
          type: object
          description: Safe-to-display configuration; secret values are omitted.
          additionalProperties: true
    PluginConfiguration:
      type: object
      additionalProperties: false
      required: [values, configurationSchema]
      properties:
        values:
          type: object
          description: Safe-to-display configured values; secret values are omitted.
          additionalProperties: true
        configurationSchema:
          type: object
          description: JSON Schema describing this plugin's distinct values object.
          additionalProperties: true
    PluginApiCatalog:
      type: object
      additionalProperties: false
      required: [pluginVersion, apiVersion, operations]
      properties:
        pluginVersion:
          type: string
        apiVersion:
          type: string
        operations:
          type: array
          items:
            $ref: "#/components/schemas/PluginOperation"
    PluginOperation:
      type: object
      additionalProperties: false
      required: [operationId, name, method, path, inputSchema, outputSchema]
      properties:
        operationId:
          type: string
          description: Stable plugin-local identifier used in the Ember invocation URL.
        name:
          type: string
        description:
          type: string
        method:
          type: string
          const: POST
          description: Ember-facing invocation method; upstream method is private to the adapter.
        path:
          type: string
          description: Ember-facing path template, never an upstream URL.
        inputSchema:
          type: object
          description: JSON Schema for the invocation input envelope.
          additionalProperties: true
        outputSchema:
          type: object
          description: JSON Schema for the sanitized operation result.
          additionalProperties: true
    PluginOperationInput:
      type: object
      additionalProperties: false
      required: [pathParams, query, body]
      properties:
        pathParams:
          type: object
          additionalProperties: false
        query:
          type: object
          additionalProperties: false
        body:
          type: object
          additionalProperties: true
    PluginOperationResult:
      type: object
      additionalProperties: false
      properties:
        data: {}
    Agent:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
          description: >-
            The agent's ID: its sandbox router policy name for agents from the
            operator's agents file, or the ID an admin chose under
            /v1/admin/ai/agents.
        name:
          type: string
          description: Display name chosen by the operator or an admin.
        harness:
          type: string
          description: Set for agents an admin added; for example claude-code or codex.
        model:
          type: string
          description: Display name of the agent's default model, if an admin set one.
    CatalogModel:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          maxLength: 200
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:/@-]*$'
          description: The gateway's model name, which agents ask the gateway for.
        name: {type: string, maxLength: 80}
    CatalogAgent:
      type: object
      additionalProperties: false
      required: [id, name, harness, routerAgent, worker, models, enabled]
      description: >-
        A turn agent (routerAgent set, worker empty) runs in the sandbox
        router. A session agent (harness opencode, worker set, routerAgent
        empty) is a session on a worker from the operator's agents file.
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$', description: Must not match an agent in the operator's agents file.}
        name: {type: string, maxLength: 80}
        harness: {type: string, enum: [claude-code, codex, opencode, custom]}
        routerAgent:
          type: string
          pattern: '^([a-z][a-z0-9-]{0,62})?$'
          description: The harness image's name in the sandbox router policy; empty for opencode.
        worker:
          type: string
          pattern: '^([a-z][a-z0-9-]{0,62})?$'
          description: ID of a worker listed in workers; set only for opencode.
        models:
          type: array
          maxItems: 16
          items: {type: string}
        defaultModel:
          type: string
          description: One of models; named in each chat turn. Defaults to the first.
        enabled:
          type: boolean
          description: Whether people can start chats with this agent.
    Worker:
      type: object
      additionalProperties: false
      required: [id, harness]
      description: A harness worker from the operator's agents file; its URL and password are not shown.
      properties:
        id: {type: string}
        harness: {type: string, enum: [opencode]}
    AICatalog:
      type: object
      additionalProperties: false
      required: [persisted, chatEnabled, harnesses, workers, gateway, operatorAgents, models, agents]
      properties:
        persisted: {type: boolean, description: False when the API has no EMBER_AI_CATALOG_FILE.}
        chatEnabled: {type: boolean}
        harnesses: {type: array, items: {type: string}}
        workers: {type: array, items: {$ref: "#/components/schemas/Worker"}}
        gateway:
          type: object
          additionalProperties: false
          required: [configured]
          properties:
            configured:
              type: boolean
              description: Whether EMBER_MODEL_GATEWAY_URL and its key file are set.
        operatorAgents: {type: array, items: {$ref: "#/components/schemas/Agent"}}
        models: {type: array, items: {$ref: "#/components/schemas/CatalogModel"}}
        agents: {type: array, items: {$ref: "#/components/schemas/CatalogAgent"}}
    AgentList:
      type: object
      additionalProperties: false
      required: [enabled, agents]
      properties:
        enabled:
          type: boolean
          description: Whether this instance can run agents for chats.
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
    ChatSummary:
      type: object
      additionalProperties: false
      required: [id, title, agent, created, updated, messageCount, pending]
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{16}$'
        title:
          type: string
        agent:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        messageCount:
          type: integer
          minimum: 0
        pending:
          type: boolean
          description: Whether an agent run for this chat is in progress.
    Chat:
      type: object
      additionalProperties: false
      required: [schema, id, title, agent, created, updated, messages]
      description: >-
        Stored as chats/<id>.json in the project directory. The file uses the
        same shape, so it stays readable without Ember.
      properties:
        schema:
          type: string
          const: ember.chat/v1
        id:
          type: string
          pattern: '^[0-9a-f]{16}$'
        title:
          type: string
        agent:
          type: string
          description: ID of the agent this chat runs.
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, role, content, created]
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{16}$'
        role:
          type: string
          enum: [user, agent]
        content:
          type: string
          description: Message text. Agent answers are plain text or Markdown; render them as text.
        status:
          type: string
          enum: [pending, completed, failed]
          description: Present on agent messages only.
        error:
          type: string
          description: User-facing reason, present when status is failed.
        run:
          type: string
          description: Sandbox router run ID, for the operator's router log.
        created:
          type: string
          format: date-time
